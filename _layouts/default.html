<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #24292f; background: #fff; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(880px, calc(100% - 40px)); margin: 40px auto 80px; }
      h1, h2 { padding-bottom: .35rem; border-bottom: 1px solid #d0d7de; line-height: 1.25; }
      h1 { font-size: 2rem; }
      h2 { margin-top: 2rem; font-size: 1.45rem; }
      a { color: #0969da; }
      img { vertical-align: middle; }
      hr { height: 1px; margin: 2rem 0; border: 0; background: #d8dee4; }
      @media (max-width: 600px) { main { width: min(100% - 28px, 880px); margin-top: 24px; } }
    </style>
  </head>
  <body>
    <main>{{ content }}</main>
  </body>
</html>
